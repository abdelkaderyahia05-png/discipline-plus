  <script>
    // Invitation d'installation de Chrome : on la garde pour le bouton « Installer » des Paramètres.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__invitation = e; window.dispatchEvent(new Event('dp-installation')); });
    window.addEventListener('appinstalled', function () { window.__invitation = null; window.dispatchEvent(new Event('dp-installation')); });
    // Service worker : cache hors ligne + notifications.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
          // Au premier lancement, on signale au service worker tout ce que la page a déjà chargé pour qu'il le mette en cache.
          function rechauffer() {
            var urls = performance.getEntriesByType('resource').map(function (r) { return r.name; });
            if (reg.active) reg.active.postMessage({ type: 'rechauffer', urls: urls });
          }
          setTimeout(rechauffer, 3000); setTimeout(rechauffer, 12000);
        }).catch(function () { /* pas de service worker (ex. page ouverte en file://) : l'appli marche quand même en ligne */ });
      });
    }
  </script>

    function afficherErreur(msg) {
      console.error('[clone-rapide]', msg);
      var b = document.getElementById('erreurs');
      if (!b) { b = document.createElement('pre'); b.id = 'erreurs';
        b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;margin:0;padding:12px;background:#b91c1c;color:#fff;font:12px/1.4 monospace;z-index:99999;white-space:pre-wrap';
        document.body.appendChild(b); }
      b.textContent += 'ERREUR : ' + msg + '\n';
    }
    window.addEventListener('error', function (e) { afficherErreur(e.message + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '')); });

    /* ---------- vérification de la photo par l'IA (fonction Supabase « verifier-photo ») ---------- */
    // Réduit la photo (1280 px max, JPEG) avant l'envoi : plus rapide et plus léger.
    const reduirePhoto = (src) => new Promise((ok) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { ok(c.toDataURL('image/jpeg', 0.8)); } catch (e) { ok(src); }
      };
      img.onerror = () => ok(src);
      img.src = src;
    });
    // Renvoie { valide, raison } si l'IA a jugé, ou { secours: message } s'il faut revenir à la checklist.
    async function verifierPhoto(session, mission, photo) {

      const ctrl = new AbortController();
      const minuteur = setTimeout(() => ctrl.abort(), 30000);
      try {
        const image = await reduirePhoto(photo);
        const r = await fetch(`${SUPABASE_URL}/functions/v1/verifier-photo`, {
          method: 'POST', signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_CLE, Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ image, titre: mission.titre, desc: mission.desc, checklist: mission.checklist }),

        const d = await r.json().catch(() => ({}));

        return { secours: 'L’IA ne répond pas (réseau ou serveur) : ta checklist fait foi.' };

    /* ---------- utilitaires ---------- */
    const fmt = (s) => { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60); return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
    /* ---------- flamme de série ----------
       La série se calcule à partir de l'historique des missions validées (une date par validation) :
       jours d'affilée avec au moins une mission validée, en partant d'aujourd'hui (si faite) ou d'hier.
       Joker : un par semaine (lundi → dimanche), il sauve tout seul UN jour manqué entouré de jours faits.
       Le jour sauvé garde la série en vie mais ne compte pas. */
    const midi = (d) => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };
    const cleJour = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
    const decaler = (d, n) => { const x = midi(d); x.setDate(x.getDate() + n); return x; };
    const lundiDe = (d) => decaler(d, -((new Date(d).getDay() + 6) % 7));
    function calculerSerie(historique, maintenant = Date.now()) {
      const faits = new Set((historique || []).map((h) => h && h.date && cleJour(h.date)).filter(Boolean));
      const auj = midi(maintenant);
      const faitAujourdhui = faits.has(cleJour(auj));
      const jokers = [], semaines = new Set();
      let d = faitAujourdhui ? auj : decaler(auj, -1), serie = 0;
      for (let i = 0; i < 4000; i++) {
        if (faits.has(cleJour(d))) { serie++; d = decaler(d, -1); continue; }
        const avant = decaler(d, -1), sem = cleJour(lundiDe(d));
        if (!semaines.has(sem) && faits.has(cleJour(avant))) { semaines.add(sem); jokers.push(cleJour(d)); d = avant; continue; }
        break;
      }
      return { serie, faitAujourdhui, faits, jokers, jokerDispo: !semaines.has(cleJour(lundiDe(auj))) };
    }
    const JOURS_SEMAINE = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

      const ecart = Math.round((midi(Date.now()) - d) / 86400000);
      return ecart === 1 ? 'hier' : ecart === 2 ? 'avant-hier' : ecart < 7 ? JOURS_SEMAINE[d.getDay()] : `le ${d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}`;

    /* ================= CHAT ANIMÉ =================
       À chaque ouverture : la vidéo « toc toc » (le chat entre, croise les bras, tape au carreau),
       puis il reste dans sa pose finale (bras croisés) et respire doucement.
       La vidéo est lue depuis un blob (fetch → cache du service worker) : pas de requêtes « Range »,
       donc ça marche hors ligne, y compris sur iPhone. Sans vidéo, on montre directement la pose. */
    const VIDEO_INTRO = 'img/chat-intro.mp4', POSE_CHAT = 'img/chat-pose.jpg';
    let blobIntro = null, urlIntro = null;
    function chargerIntro() {
      return blobIntro || (blobIntro = fetch(VIDEO_INTRO)
        .then((r) => { if (!r.ok) throw new Error('vidéo ' + r.status); return r.blob(); })
        .then((b) => (urlIntro = URL.createObjectURL(b)))
        .catch((e) => { blobIntro = null; throw e; }));

    const mouvementReduit = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
    const PAUSE_ENTRE_INTROS = 3500; // le chat attend bras croisés, puis recommence son entrée

    /* boucle = true : l'intro se rejoue (entrée, toc toc, bras croisés, pause) tant que la mission n'est pas faite.
       boucle = false : le chat reste dans sa pose bras croisés et respire doucement. */
    function ChatAnime({ boucle = false, alt, style, imageStyle, onPhase, boutonSon }) {
      const ref = useRef(null);
      const reduit = useMemo(mouvementReduit, []);
      const anime = boucle && !reduit;
      const [src, setSrc] = useState(urlIntro);
      const [phase, setPhase] = useState(anime ? 'intro' : 'pose'); // intro | pose | attente (lecture auto bloquée)

      const animeRef = useRef(anime); animeRef.current = anime;

      useEffect(() => { onPhase && onPhase(phase); }, [phase]);
      useEffect(() => {
        if (!anime) return;
        let actif = true;
        chargerIntro().then((url) => { if (actif) setSrc(url); }).catch(() => { if (actif) setPhase('pose'); });
        return () => { actif = false; };
      }, [anime]);
      // Mission faite : on arrête tout, le chat garde sa pose.
      useEffect(() => {
        if (anime) { setPhase((ph) => (ph === 'pose' && !minuteur.current ? 'intro' : ph)); return; }
        clearTimeout(minuteur.current); minuteur.current = null;
        const v = ref.current; if (v) v.pause();
        setPhase('pose');
      }, [anime]);
      useEffect(() => () => { clearTimeout(minuteur.current); if (geste.current) geste.current(); }, []);

      // Certains téléphones (mode économie d'énergie…) refusent la lecture automatique :
      // on montre la pose et on lance l'intro au premier toucher de l'écran.
      const attendreGeste = () => {
        setPhase('attente');
        if (geste.current) return;
        const go = () => { nettoyer(); if (animeRef.current) { setPhase('intro'); lancer(); } };
        const nettoyer = () => { ['pointerdown', 'touchstart', 'keydown'].forEach((t) => document.removeEventListener(t, go, true)); geste.current = null; };
        ['pointerdown', 'touchstart', 'keydown'].forEach((t) => document.addEventListener(t, go, true));
        geste.current = nettoyer;
      };
      function lancer() {
        const v = ref.current; if (!v) return;
        clearTimeout(minuteur.current); minuteur.current = null;
        v.muted = !son.current;
        try { v.currentTime = 0; } catch (e) {}
        const p = v.play();
        if (p) p.catch((e) => {
          if (e && e.name === 'AbortError') return;
          if (!v.muted) { v.muted = true; son.current = false; v.play().catch(attendreGeste); } // son refusé : on relance sans le son
          else attendreGeste();
        });
      }
      useEffect(() => { if (phase === 'intro' && src && ref.current && ref.current.paused) lancer(); }, [phase, src]);

      const fini = () => {
        son.current = false;
        setPhase('pose');
        if (animeRef.current) minuteur.current = setTimeout(() => { minuteur.current = null; if (animeRef.current) setPhase('intro'); }, PAUSE_ENTRE_INTROS);
      };
      const ecouter = () => { son.current = true; setPhase('intro'); lancer(); };

      const poseVisible = !anime || phase !== 'intro';
      return (
        <>
          <div className="relative" style={{ ...style, overflow: 'hidden' }}>
            {anime && src && <video ref={ref} src={src} muted playsInline preload="auto" onEnded={fini}
              aria-label={alt} className="absolute inset-0 block h-full w-full object-cover" style={imageStyle} />}
            {poseVisible && <img src={POSE_CHAT} alt={alt} className="chat-respire absolute inset-0 block h-full w-full object-cover" style={imageStyle} />}
          </div>
          {boutonSon && anime && (
            <button onClick={ecouter} aria-label="Revoir le chat avec le son" className="pression absolute flex items-center justify-center rounded-full"
              style={{ ...boutonSon, width: u(76), height: u(76), background: 'rgba(255,255,255,.8)', backdropFilter: 'blur(10px)', border: '1px solid rgba(255,255,255,.95)', boxShadow: `0 ${u(8)} ${u(22)} rgba(60,30,140,.22)` }}>
              <Volume2 color="#5d3fd3" style={{ width: '48%', height: '48%' }} />
            </button>
          )}
        </>

    /* ================= CHAT « BIEN JOUÉ » =================
       Mission faite : le chat sourit, fait un clin d'œil et lève le pouce, en boucle et sans le son.
       Comme l'intro, la vidéo est lue depuis un blob (WebM VP9 si possible, sinon MP4 H.264) pour marcher hors ligne.
       Animations réduites : image fixe (pouce levé). */
    const VIDEO_BRAVO = { webm: 'video/chat-bravo.webm', mp4: 'video/chat-bravo.mp4' };
    const POSTER_BRAVO = 'video/chat-bravo.jpg', FIXE_BRAVO = 'video/chat-bravo-fixe.jpg';
    let blobBravo = null;
    function chargerBravo() {
      if (blobBravo) return blobBravo;
      let webm = false;
      try { webm = !!document.createElement('video').canPlayType('video/webm; codecs="vp9"'); } catch (e) {}

    function ChatBravo({ alt, style, imageStyle }) {
      const ref = useRef(null);
      const reduit = useMemo(mouvementReduit, []);
      const [src, setSrc] = useState(null);
      useEffect(() => {
        if (reduit) return;
        let actif = true;
        chargerBravo().then((url) => { if (actif) setSrc(url); }).catch(() => {});
        return () => { actif = false; };
      }, [reduit]);
      useEffect(() => {
        const v = ref.current; if (!v || !src) return;
        const p = v.play();
        if (!p) return;
        let nettoyer = null;
        p.catch((e) => {
          if (e && e.name === 'AbortError') return;
          // lecture auto refusée : on garde l'image d'attente et on relance au premier toucher
          const go = () => { nettoyer(); v.play().catch(() => {}); };
          nettoyer = () => ['pointerdown', 'touchstart', 'keydown'].forEach((t) => document.removeEventListener(t, go, true));
          ['pointerdown', 'touchstart', 'keydown'].forEach((t) => document.addEventListener(t, go, true));
        });
        return () => { if (nettoyer) nettoyer(); };
      }, [src]);
      return (
        <div className="relative" style={{ ...style, overflow: 'hidden' }}>
          {reduit || !src
            ? <img src={reduit ? FIXE_BRAVO : POSTER_BRAVO} alt={alt} className="absolute inset-0 block h-full w-full object-cover" style={imageStyle} />

    /* ================= FLAMME DE SÉRIE + PALIERS DU CHAT ================= */
    const CLE_FLAMME = 'disciplineplus.flamme'; // dernière série vue sur cet appareil (pour l'animation de montée)
    function useSerieQuiMonte(serie) {
      const [monte, setMonte] = useState(false);
      useEffect(() => {
        let vu = null;
        try { vu = JSON.parse(localStorage.getItem(CLE_FLAMME)); } catch (e) {}
        try { localStorage.setItem(CLE_FLAMME, JSON.stringify(serie)); } catch (e) {}
        if (typeof vu === 'number' && serie > vu) {
          setMonte(true);
          const id = setTimeout(() => setMonte(false), 1900);
          return () => clearTimeout(id);
        }
      }, [serie]);
      return monte;
    }

    /* ================= STATS ================= */
    function Stats({ etat, infoSerie }) {
      const jours = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
      const aujourd = (new Date().getDay() + 6) % 7;
      const lundi = lundiDe(Date.now());
      const valeurs = jours.map((_, i) => { const c = cleJour(decaler(lundi, i)); return infoSerie.faits.has(c) ? 1 : infoSerie.jokers.includes(c) ? 'joker' : 0; });
      const total = 11 + etat.terminees + (etat.serie > 0 ? 1 : 0);
      return (
        <EcranSimple titre="Stats" sousTitre="Ta discipline, en chiffres.">
          <div className="grid grid-cols-2" style={{ gap: u(24) }}>
            {[['🔥', 'Série actuelle', `${etat.serie} jours`], ['⭐', 'Niveau', `${etat.niveau}`], ['✅', 'Missions validées', `${total}`], ['⚡', 'XP du niveau', `${etat.xp} / ${XP_NIVEAU}`]].map(([e, l, v]) => (
              <div key={l} className="verre-blanc" style={{ borderRadius: u(40), padding: u(30) }}>
                <div style={{ fontSize: u(40) }}>{e}</div>
                <div style={{ fontSize: t(20), color: '#5b4f86', fontWeight: 500, marginTop: u(8) }}>{l}</div>
                <div style={{ fontSize: u(40), fontWeight: 800, letterSpacing: '-0.03em' }}>{v}</div>
              </div>
            ))}
          </div>
          <div className="carte-violette text-white" style={{ borderRadius: u(46), padding: u(36), marginTop: u(26) }}>
            <div style={{ fontSize: u(26), fontWeight: 700 }}>Cette semaine</div>
            <div className="flex items-end justify-between" style={{ height: u(200), marginTop: u(24) }}>
              {valeurs.map((v, i) => (
                <div key={i} className="flex flex-col items-center" style={{ gap: u(12) }}>
                  <div className="transition-all duration-700 flex items-start justify-center" title={v === 'joker' ? 'Joker utilisé' : undefined} style={{ width: u(54), height: u(v === 1 ? 150 : v ? 90 : 26), borderRadius: u(16), fontSize: u(28), paddingTop: u(6), background: v === 1 ? 'linear-gradient(180deg,#c7a6ff,#7a3cf6)' : v ? 'linear-gradient(180deg,#b9e3ff,#5aa7f0)' : 'rgba(255,255,255,.14)', boxShadow: v ? '0 0 14px rgba(151,71,255,.6)' : 'none' }}>{v === 'joker' ? '🛡️' : ''}</div>
                  <span style={{ fontSize: t(20), color: i === aujourd ? '#fff' : '#bfb0ee', fontWeight: i === aujourd ? 700 : 500 }}>{jours[i]}</span>
                </div>
              ))}
            </div>
          </div>
          <h3 style={{ fontSize: u(28), fontWeight: 700, marginTop: u(36), marginBottom: u(16) }}>Historique</h3>
          {etat.historique.length === 0 ? (
            <p className="verre-blanc" style={{ borderRadius: u(36), padding: u(30), fontSize: t(21), color: '#5b4f86' }}>Valide ta première mission pour la voir apparaître ici.</p>
          ) : (
            <div className="verre-blanc" style={{ borderRadius: u(36), padding: `${u(8)} ${u(30)}` }}>
              {etat.historique.slice().reverse().map((h, i) => (
                <div key={i} className="flex items-center" style={{ padding: `${u(20)} 0`, borderTop: i ? '1px solid #eee8fa' : 'none', gap: u(20) }}>
                  <span className="flex items-center justify-center rounded-full" style={{ width: u(56), height: u(56), background: '#f1edff', fontSize: u(28) }}>{h.emoji}</span>
                  <span className="flex-1">
                    <span className="block" style={{ fontSize: t(22), fontWeight: 600 }}>{h.titre}</span>
                    <span className="block" style={{ fontSize: t(18), color: '#7a6fa3' }}>{new Date(h.date).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })}</span>
                  </span>
                  <span style={{ fontSize: t(20), fontWeight: 700, color: '#7138F5' }}>+{XP_PAR_MISSION} XP</span>
                </div>
              ))}
            </div>
          )}
        </EcranSimple>
      );
    }

    /* ================= RÉCOMPENSES ================= */

      const badges = [
        { e: '🎯', n: 'Première mission', ok: total >= 1, d: 'Valider une mission' },

        { e: '⭐', n: 'Niveau 5', ok: etat.niveau >= 5, d: 'Atteindre le niveau 5' },
        { e: '📚', n: 'Lecteur', ok: etat.historique.some((h) => h.jour === 3), d: 'Valider « Lis 10 pages »' },
        { e: '💪', n: 'Costaud', ok: etat.historique.some((h) => h.jour === 2), d: 'Valider « Fais 15 pompes »' },

      return (
        <EcranSimple titre="Récompenses" sousTitre="Ce que ta discipline t'a rapporté.">

            <img src="img/chat.jpg" alt="Le chat Discipline+" className="absolute right-0 top-0 h-full object-cover" style={{ width: '52%', objectPosition: '50% 12%', maskImage: 'linear-gradient(90deg,transparent,#000 30%)', WebkitMaskImage: 'linear-gradient(90deg,transparent,#000 30%)' }} />
            <div className="relative" style={{ padding: u(40), width: '60%' }}>
              <Etoile taille={80} />
              <div style={{ fontSize: t(22), color: '#d9ccff', marginTop: u(16) }}>Ton niveau</div>

              <div className="overflow-hidden rounded-full" style={{ marginTop: u(20), height: u(16), background: 'rgba(130,100,220,.35)' }}>
                <div className="h-full rounded-full" style={{ width: `${(etat.xp / XP_NIVEAU) * 100}%`, background: 'linear-gradient(90deg,#9747FF,#b98bff)' }} />

          <div className="grid grid-cols-3" style={{ gap: u(20) }}>
            {badges.map((b) => (

                <span style={{ fontSize: t(19), fontWeight: 700, marginTop: u(14), lineHeight: 1.15 }}>{b.n}</span>
                <span style={{ fontSize: t(15, 8), color: '#7a6fa3', marginTop: u(6) }}>{b.ok ? 'Débloqué ✓' : b.d}</span>
              </div>
            ))}
          </div>
        </EcranSimple>
      );

            <Info style={{ width: u(30), height: u(30), flex: 'none', marginTop: u(2) }} />

    /* ================= COMPTE + SAUVEGARDE EN LIGNE =================
       localStorage reste la copie de travail (l'appli marche sans compte et hors ligne).
       Connecté : chaque changement de la progression est envoyé à Supabase ; au lancement, au retour du réseau
       et quand on revient sur l'appli, on récupère la version en ligne si elle est plus récente. */
    function useCompte(etat, setEtat) {
      const [session, setSession] = useState(null);
      const [statut, setStatut] = useState('local'); // local | synchro | ok | horsligne | erreur
      const [derniere, setDerniere] = useState(null);
      const uid = session && session.user ? session.user.id : null;
      const etatRef = useRef(etat); etatRef.current = etat;
      const uidRef = useRef(uid); uidRef.current = uid;
      const signature = useRef(JSON.stringify(extraire(etat)));
      const occupe = useRef(false), aRefaire = useRef(false), minuteur = useRef(null);

      const synchroniser = async () => {
        const id = uidRef.current;
        if (!id) return;
        if (occupe.current) { aRefaire.current = true; return; }
        if (!navigator.onLine) { setStatut('horsligne'); return; }
        occupe.current = true; setStatut('synchro');
        try {
          const s = lireSync();
          const lie = s.uid === id; // la copie locale appartient-elle déjà à ce compte ?
          const majLocale = lie ? (s.majLocale || 0) : 0;
          const envoye = lie ? (s.envoye || 0) : 0;
          const { data, error } = await supabase.from('progression').select('etat, maj_le').eq('user_id', id).maybeSingle();
          if (error) throw error;
          const distant = data ? Number(data.maj_le) || 0 : 0;
          if (data && (!lie || distant > majLocale)) {
            // la version en ligne gagne (nouvel appareil, ou modifiée ailleurs plus récemment)
            const recu = extraire(data.etat || {});
            signature.current = JSON.stringify(extraire({ ...etatRef.current, ...recu }));
            ecrireSync({ uid: id, majLocale: distant, envoye: distant });
            setEtat((e) => ({ ...e, ...recu }));
          } else if (!data || majLocale > envoye || majLocale > distant) {
            const quand = majLocale || Date.now();
            const { error: err } = await supabase.from('progression')
              .upsert({ user_id: id, etat: extraire(etatRef.current), maj_le: quand }, { onConflict: 'user_id' });
            if (err) throw err;
            const apres = lireSync();
            ecrireSync({ ...apres, uid: id, majLocale: Math.max(apres.uid === id ? apres.majLocale || 0 : 0, quand), envoye: quand });
            if ((apres.majLocale || 0) > quand) aRefaire.current = true; // modifié pendant l'envoi
          }
          setStatut('ok'); setDerniere(Date.now());
        } catch (e) {
          setStatut(navigator.onLine ? 'erreur' : 'horsligne');
        } finally {
          occupe.current = false;
          if (aRefaire.current) { aRefaire.current = false; setTimeout(synchroniser, 300); }
        }
      };

      // session : celle gardée sur l'appareil, puis les connexions / déconnexions
      useEffect(() => {
        supabase.auth.getSession().then(({ data }) => setSession(data.session)).catch(() => {});
        const { data } = supabase.auth.onAuthStateChange((evenement, s) => setSession(s));
        return () => data.subscription.unsubscribe();
      }, []);

      // connexion (ou lancement déjà connecté) : première synchronisation
      useEffect(() => { if (uid) synchroniser(); else setStatut('local'); }, [uid]);

      // chaque changement local de la progression est daté, puis envoyé peu après
      useEffect(() => {
        const sig = JSON.stringify(extraire(etat));
        if (sig === signature.current) return;
        signature.current = sig;
        ecrireSync({ ...lireSync(), majLocale: Date.now() });
        if (!uidRef.current) return;
        clearTimeout(minuteur.current);
        minuteur.current = setTimeout(synchroniser, 1200);
      }, [etat]);

      // retour du réseau, retour sur l'appli : on se remet à jour
      useEffect(() => {
        const enLigne = () => synchroniser();
        const horsLigne = () => { if (uidRef.current) setStatut('horsligne'); };
        const visible = () => { if (document.visibilityState === 'visible') synchroniser(); };
        window.addEventListener('online', enLigne); window.addEventListener('offline', horsLigne);
        document.addEventListener('visibilitychange', visible);
        return () => { window.removeEventListener('online', enLigne); window.removeEventListener('offline', horsLigne); document.removeEventListener('visibilitychange', visible); };
      }, []);

      const traduire = (e) => {
        const m = String((e && e.message) || e || '');
        if (/expired|invalid.*(token|otp)|(token|otp).*invalid/i.test(m)) return 'Code faux ou expiré. Vérifie-le, ou demande-en un nouveau.';
        if (/security purposes|after \d+ seconds/i.test(m)) return 'Attends une minute avant de redemander un code.';
        if (/rate limit|too many/i.test(m)) return 'Trop de codes demandés : réessaie dans un moment.';
        if (/valid email|invalid.*email|email.*invalid/i.test(m)) return 'Cette adresse e-mail n’est pas valide.';
        if (/fetch|network|failed to/i.test(m) || !navigator.onLine) return 'Pas de réseau : réessaie quand tu seras connecté à Internet.';
        return 'Oups, ça n’a pas marché. Réessaie.';
      };
      const adresseRetour = () => window.location.origin + window.location.pathname;
      const agir = async (promesse) => {
        try { const { data, error } = await promesse; if (error) return { erreur: traduire(error) }; return { data }; }
        catch (e) { return { erreur: traduire(e) }; }
      };

      return {
        session, email: session && session.user ? session.user.email : null, statut, derniere,
        synchroniser,
        envoyerCode: (email) => agir(supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: adresseRetour() } })),
        verifierCode: (email, code) => agir(supabase.auth.verifyOtp({ email, token: code, type: 'email' })),
        deconnexion: async () => {
          try { await supabase.auth.signOut({ scope: 'local' }); } catch (e) {}
          ecrireSync({ majLocale: lireSync().majLocale }); // la progression reste sur l'appareil, mais n'est plus liée au compte
          setSession(null);
        },
        // Supprime le compte en ligne (fonction Supabase « supprimer-compte ») puis vide le stockage local de l'appli.
        supprimerCompte: async () => {
          if (!navigator.onLine) return { erreur: 'Pas de réseau : connecte-toi à Internet pour supprimer ton compte.' };
          let s = null;
          try { s = (await supabase.auth.getSession()).data.session; } catch (e) {}
          if (!s) return { erreur: 'Session expirée : reconnecte-toi, puis réessaie.' };
          try {
            const r = await fetch(`${SUPABASE_URL}/functions/v1/supprimer-compte`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', apikey: SUPABASE_CLE, Authorization: `Bearer ${s.access_token}` },
              body: JSON.stringify({ confirmation: 'SUPPRIMER' }),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok || !d.supprime) return { erreur: r.status === 401 ? 'Session expirée : reconnecte-toi, puis réessaie.' : 'Suppression impossible pour le moment. Réessaie plus tard.' };
          } catch (e) { return { erreur: 'Le serveur ne répond pas. Vérifie ta connexion et réessaie.' }; }
          try { await supabase.auth.signOut({ scope: 'local' }); } catch (e) {}
          try { Object.keys(localStorage).filter((k) => k.startsWith('disciplineplus.') || k.startsWith('sb-')).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
          setSession(null);
          return { ok: true };
        },
      };
    }

      const [fete, setFete] = useState(false);
      const [toast, setToast] = useState(null);
      // verdict de l'IA sur la photo : null | { etat: 'encours' | 'refus' | 'secours', texte }
      const [verif, setVerif] = useState(null);
      const fichier = useRef(null);
      const compte = useCompte(etat, setEtat);

      useEffect(() => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }, [etat]);
      // démarre le chronomètre de la mission du jour au premier lancement
      useEffect(() => {
        const m = MISSIONS[etat.index % MISSIONS.length];
        if (etat.fin == null && !etat.missionFaite && m.minutes != null) maj({ fin: Date.now() + m.minutes * 60000 });
      }, [etat.index]);
      useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 2600); return () => clearTimeout(id); }, [toast]);

      const maj = (p) => setEtat((e) => ({ ...e, ...p }));
      const m = MISSIONS[etat.index % MISSIONS.length];

      /* --- flamme de série (calculée depuis l'historique) et paliers du chat --- */
      const [jour, setJour] = useState(() => cleJour(Date.now()));
      useEffect(() => {
        const verifier = () => setJour(cleJour(Date.now()));
        const id = setInterval(verifier, 60000);
        document.addEventListener('visibilitychange', verifier);
        return () => { clearInterval(id); document.removeEventListener('visibilitychange', verifier); };
      }, []);
      const infoSerie = useMemo(() => calculerSerie(etat.historique), [etat.historique, jour]);
      useEffect(() => {
        const atteint = palierAtteint(infoSerie.serie), vu = etat.palierVu || 0;
        const p = {};
        if (etat.serie !== infoSerie.serie) p.serie = infoSerie.serie;
        if (vu > (atteint ? atteint.jours : 0)) p.palierVu = atteint ? atteint.jours : 0; // série cassée : les paliers se regagnent
        if (Object.keys(p).length) maj(p);
      }, [infoSerie.serie, etat.serie, etat.palierVu]);
      const nouveauPalier = (() => { const a = palierAtteint(infoSerie.serie); return a && a.jours > (etat.palierVu || 0) ? a : null; })();
      const palierVu = () => { if (nouveauPalier) maj({ palierVu: nouveauPalier.jours }); };

      /* --- notification quand le chronomètre arrive à 0 --- */
      const [perm, setPerm] = useState(permissionNotifs);
      const activerAlertes = async () => {
        const p = await demanderPermissionNotifs();
        setPerm(p);
        if (p === 'granted') { maj({ alertes: true }); setToast('Notifications activées 🔔'); }
        else if (p === 'denied') setToast('Notifications bloquées par le navigateur');
        else if (p === 'indisponible') setToast('Notifications indisponibles ici');
      };
      const proposerAlertes = () => { if (etat.alertes && permissionNotifs() === 'default') activerAlertes(); };
      useEffect(() => {
        if (etat.fin == null || etat.pause != null || etat.missionFaite || etat.alerteFin === etat.fin) return;
        const fin = etat.fin, titre = m.titre, alertes = etat.alertes;
        const sonner = () => {
          const texte = `Le chrono de « ${titre} » est à zéro. Valide ta mission pour débloquer tes applis.`;
          setEtat((e) => (e.fin !== fin || e.alerteFin === fin ? e
            : { ...e, alerteFin: fin, notifs: [{ id: Date.now(), titre: 'Temps écoulé ⏰', texte, lu: false }, ...e.notifs] }));
          // pas de notification système si on rouvre l'appli longtemps après l'échéance
          if (alertes && Date.now() - fin < 60000) {
            notifier('Temps écoulé ⏰', { body: texte, icon: 'icons/icon-192.png', badge: 'icons/favicon-48.png', tag: 'chrono-fin', lang: 'fr', vibrate: [120, 60, 120] });
          }
        };
        const id = setTimeout(sonner, Math.max(0, fin - Date.now()));
        return () => clearTimeout(id);
      }, [etat.fin, etat.pause, etat.missionFaite, etat.alerteFin, etat.alertes]);

      /* --- installation de l'application --- */
      const [installable, setInstallable] = useState(!!window.__invitation);
      useEffect(() => {
        const suivre = () => setInstallable(!!window.__invitation);
        window.addEventListener('dp-installation', suivre);
        return () => window.removeEventListener('dp-installation', suivre);
      }, []);
      const installer = async () => {
        const invitation = window.__invitation;
        if (!invitation) return;
        invitation.prompt();
        try { await invitation.userChoice; } catch (e) {}
        window.__invitation = null; setInstallable(false);
      };

      const ouvrir = (cle) => {
        if (cle && cle.onglet) { setOnglet(cle.onglet); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        if (cle === 'valider') { setPhoto(null); setCoches([]); setEtape(1); setVerif(null); }
        if (cle === 'notifs') maj({ notifs: etat.notifs.map((n) => ({ ...n, lu: true })) });
        setPanneau(cle);
      };

      // Mission avec photo + compte connecté : l'IA juge d'abord. Refus = ni XP ni déblocage.
      // Réseau ou IA indisponible : on retombe sur la checklist, en le disant.
      const demanderValidation = async () => {
        if (!(m.photo && photo && compte.session)) { valider(); return; }
        if (verif && verif.etat === 'encours') return;
        setVerif({ etat: 'encours', texte: 'Je regarde ta photo… ne bouge pas. 🧐' });
        const r = await verifierPhoto(compte.session, m, photo);
        if (r.secours) { setVerif({ etat: 'secours', texte: r.secours }); valider(r.secours); return; }
        if (!r.valide) { setVerif({ etat: 'refus', texte: r.raison || 'Refusé. Recommence.' }); return; }
        setVerif({ etat: 'ok', texte: r.raison }); valider();
      };

      const valider = (avertissement) => {
        if (typeof avertissement !== 'string') avertissement = null;
        if (avertissement) setToast('Validée avec ta checklist (IA indisponible)');
        let xp = etat.xp + XP_PAR_MISSION, niveau = etat.niveau, monte = false;
        while (xp >= XP_NIVEAU) { xp -= XP_NIVEAU; niveau += 1; monte = true; }
        setEtat((e) => { const historique = [...e.historique, { titre: m.titre, emoji: m.emoji, jour: m.jour, date: Date.now() }]; return {
          ...e, xp, niveau, serie: calculerSerie(historique).serie, terminees: e.terminees + 1, missionFaite: true, pause: null, historique,
          notifs: [{ id: Date.now(), titre: monte ? `Niveau ${niveau} atteint ! ⭐` : 'Mission validée ✅', texte: `+${XP_PAR_MISSION} XP. Tes applications sont débloquées.`, lu: false }, ...e.notifs] }; });
        try { if (etat.sons && navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate([40, 60, 40]); } catch (e) {}
        setEtape(2); setFete(true); setTimeout(() => setFete(false), 3600);
      };

      const missionSuivante = () => {
        const index = etat.index + 1;
        const nm = MISSIONS[index % MISSIONS.length];
        maj({ index, missionFaite: false, pause: null, fin: nm.minutes != null ? Date.now() + nm.minutes * 60000 : null });
        setPanneau(null); setToast(`Nouvelle mission : ${nm.titre}`);
      };

      const apresSuppression = () => { setEtat({ ...etatInitial(), fin: Date.now() + MISSIONS[0].minutes * 60000 }); setToast('Compte supprimé. Toutes tes données ont été effacées.'); setOnglet('accueil'); window.scrollTo({ top: 0 }); };
      const reinitialiser = () => { setEtat({ ...etatInitial(), fin: Date.now() + MISSIONS[0].minutes * 60000 }); setToast('Progression réinitialisée'); setOnglet('accueil'); };

      const peutValider = (!m.photo || photo) && coches.length === m.checklist.length;
      const appSel = panneau && panneau.app ? APPS.find((a) => a.id === panneau.app) : null;
      const missionSel = panneau && panneau.mission ? { ...MISSIONS[(etat.index + panneau.mission) % MISSIONS.length], jourAffiche: etat.index + panneau.mission + 1, k: panneau.mission } : null;

      return (
        <div className="ecran">
          {onglet === 'accueil' && <Accueil etat={etat} maj={maj} ouvrir={ouvrir} proposerAlertes={proposerAlertes} infoSerie={infoSerie} />}
          {onglet === 'stats' && <Stats etat={etat} infoSerie={infoSerie} />}
          {onglet === 'recompenses' && <Recompenses etat={etat} />}
          {onglet === 'parametres' && <Parametres etat={etat} maj={maj} reinitialiser={reinitialiser} perm={perm} activerAlertes={activerAlertes} installable={installable} installer={installer} compte={compte} setToast={setToast} apresSuppression={apresSuppression} />}
          <BarreNav onglet={onglet} setOnglet={(o) => { setOnglet(o); window.scrollTo({ top: 0 }); }} />

          {/* Validation de la mission */}
          <Feuille ouverte={panneau === 'valider'} onFermer={() => { if (etape === 2) palierVu(); setPanneau(null); }}>
            {etape === 1 ? (
              <div>
                <span className="badge-mission inline-flex items-center text-white" style={{ height: u(44), padding: `0 ${u(20)}`, borderRadius: u(22), fontSize: t(20), fontWeight: 700 }}>Validation 🎯</span>
                <h3 style={{ fontSize: u(42), fontWeight: 800, letterSpacing: '-0.03em', marginTop: u(18) }}>{m.titre} {m.emoji}</h3>
                <p style={{ fontSize: t(22), color: '#5b4f86', marginTop: u(8) }}>{m.photo ? 'Montre-moi le résultat. Pas de triche, je vois tout. 😏' : 'Coche chaque étape. Je te fais confiance… pour cette fois. 😏'}</p>

                {m.photo && (
                  <div style={{ marginTop: u(26) }}>
                    <input ref={fichier} type="file" accept="image/*" capture="environment" className="hidden"
                      onChange={(e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { setPhoto(r.result); setVerif(null); }; r.readAsDataURL(f); e.target.value = ''; }} />
                    <button onClick={() => fichier.current && fichier.current.click()} className="pression relative flex w-full flex-col items-center justify-center overflow-hidden"
                      style={{ height: u(360), borderRadius: u(40), border: photo ? 'none' : `${u(4)} dashed #c9b6ff`, background: '#f7f4ff', color: '#5b2fd6' }}>
                      {photo ? <img src={photo} alt="Ta photo" className="absolute inset-0 h-full w-full object-cover" /> : (
                        <>
                          <span className="flex items-center justify-center rounded-full btn-violet" style={{ width: u(110), height: u(110) }}><Camera color="#fff" style={{ width: '45%', height: '45%' }} /></span>
                          <span style={{ fontSize: t(24), fontWeight: 700, marginTop: u(18) }}>Prendre une photo</span>
                          <span style={{ fontSize: t(18), color: '#7a6fa3', marginTop: u(4) }}>ou en choisir une dans ta galerie</span>
                        </>
                      )}
                      {photo && <span className="absolute rounded-full bg-white/90" style={{ right: u(20), bottom: u(20), padding: `${u(10)} ${u(20)}`, fontSize: t(18), fontWeight: 700 }}>Changer</span>}
                    </button>
                    <p className="flex items-center" style={{ gap: u(10), fontSize: t(17), color: '#7a6fa3', marginTop: u(12) }}>
                      <Info style={{ width: u(26), height: u(26), flex: 'none' }} /> {compte.session
                        ? "En validant, ta photo est envoyée à une IA (Claude, d'Anthropic) qui vérifie la mission, puis oubliée : elle n'est pas conservée."
                        : "Pas connecté : ta photo reste sur ton appareil et n'est pas vérifiée par l'IA. Connecte-toi dans les Paramètres pour que je la juge."}
                    </p>
                  </div>
                )}

                <div style={{ marginTop: u(26) }}>
                  {m.checklist.map((c) => {
                    const ok = coches.includes(c);
                    return (
                      <button key={c} onClick={() => setCoches((cs) => (cs.includes(c) ? cs.filter((x) => x !== c) : [...cs, c]))} className="pression flex w-full items-center"
                        style={{ gap: u(20), padding: `${u(20)} ${u(24)}`, marginBottom: u(14), borderRadius: u(30), background: ok ? '#f1edff' : '#faf9fd', border: `${u(2)} solid ${ok ? '#b89cff' : '#eee8fa'}` }}>
                        <span className="flex items-center justify-center rounded-full transition-all" style={{ width: u(46), height: u(46), background: ok ? 'linear-gradient(145deg,#9747FF,#7138F5)' : '#fff', border: ok ? 'none' : `${u(3)} solid #d8ccf6` }}>
                          {ok && <Check color="#fff" strokeWidth={3.5} style={{ width: '60%', height: '60%' }} />}
                        </span>
                        <span style={{ fontSize: t(23), fontWeight: 600 }}>{c}</span>
                      </button>
                    );
                  })}
                </div>
                {verif && verif.etat !== 'ok' && (
                  <div role="status" aria-live="polite" style={{ marginTop: u(8), marginBottom: u(8), padding: `${u(18)} ${u(22)}`, borderRadius: u(28), fontSize: t(20), fontWeight: 600,
                    background: verif.etat === 'refus' ? '#fff0f0' : verif.etat === 'secours' ? '#fff7e6' : '#f1edff',
                    color: verif.etat === 'refus' ? '#b42318' : verif.etat === 'secours' ? '#8a5a00' : '#5b2fd6',
                    border: `${u(2)} solid ${verif.etat === 'refus' ? '#f5c2c0' : verif.etat === 'secours' ? '#f3d9a4' : '#d8ccf6'}` }}>
                    {verif.etat === 'refus' ? '❌ Refusé : ' : verif.etat === 'secours' ? '⚠️ ' : ''}{verif.texte}
                    {verif.etat === 'refus' && <div style={{ fontSize: t(17), fontWeight: 500, marginTop: u(6) }}>Corrige, reprends une photo, et reviens me voir.</div>}
                  </div>
                )}
                <button disabled={!peutValider || (verif && verif.etat === 'encours')} onClick={demanderValidation} className="pression btn-violet flex w-full items-center justify-center text-white disabled:opacity-40 disabled:shadow-none"
                  style={{ height: u(100), borderRadius: u(50), fontSize: u(29), fontWeight: 700, marginTop: u(16), gap: u(14) }}>
                  <Check strokeWidth={3.2} style={{ width: u(38), height: u(38) }} /> {verif && verif.etat === 'encours' ? 'Vérification…' : 'Valider ma mission'}
                </button>
                {!peutValider && <p className="text-center" style={{ fontSize: t(18), color: '#7a6fa3', marginTop: u(12) }}>{m.photo && !photo ? 'Ajoute une photo et ' : ''}{coches.length < m.checklist.length ? 'coche toutes les étapes.' : ''}</p>}
              </div>
            ) : (
              <div className="pop text-center">
                <div className="relative mx-auto overflow-hidden" style={{ width: u(420), height: u(460), borderRadius: u(50), background: 'linear-gradient(180deg,#3a2a68,#1d1438)' }}>
                  <ChatBravo alt="Le chat Discipline+ satisfait lève le pouce" style={{ width: '100%', height: '100%' }} imageStyle={{ objectPosition: '50% 20%' }} />
                </div>
                <h3 style={{ fontSize: u(46), fontWeight: 800, letterSpacing: '-0.03em', marginTop: u(26) }}>Mission accomplie ! 🎉</h3>
                <p style={{ fontSize: t(23), color: '#5b4f86', marginTop: u(8) }}>{verif && verif.etat === 'ok' && verif.texte ? verif.texte : "Pas mal… je savais que t'en étais capable. 😎"}</p>
                {verif && verif.etat === 'secours' && <p role="status" style={{ fontSize: t(18), color: '#8a5a00', background: '#fff7e6', borderRadius: u(24), padding: `${u(12)} ${u(18)}`, marginTop: u(12) }}>⚠️ {verif.texte}</p>}
                <div className="grid grid-cols-3" style={{ gap: u(16), marginTop: u(28) }}>
                  {[[`+${XP_PAR_MISSION}`, 'XP gagnés'], [`🔥 ${infoSerie.serie}`, 'jours de série'], ['5', 'applis débloquées']].map(([v, l]) => (
                    <div key={l} style={{ background: '#f1edff', borderRadius: u(30), padding: `${u(20)} ${u(8)}` }}>
                      <div style={{ fontSize: u(38), fontWeight: 800, color: '#7138F5' }}>{v}</div>
                      <div style={{ fontSize: t(17), color: '#5b4f86', fontWeight: 500 }}>{l}</div>
                    </div>
                  ))}
                </div>
                {nouveauPalier && <div style={{ marginTop: u(24) }}><CartePalier palier={nouveauPalier} compact /></div>}
                <button onClick={() => { palierVu(); setPanneau(null); }} className="pression btn-violet flex w-full items-center justify-center text-white" style={{ height: u(100), borderRadius: u(50), fontSize: u(29), fontWeight: 700, marginTop: u(30) }}>
                  Super, merci chef !
                </button>
              </div>
            )}
          </Feuille>

          {/* Ta série : flamme, joker, paliers du chat */}
          <Feuille ouverte={panneau === 'serie'} onFermer={() => setPanneau(null)}>
            <DetailSerie info={infoSerie} />
          </Feuille>

          {/* Nouveau palier atteint (hors écran de validation, qui l'affiche lui-même) */}
          <Feuille ouverte={!!nouveauPalier && panneau === null} onFermer={palierVu}>
            {nouveauPalier && <CartePalier palier={nouveauPalier} onOk={palierVu} />}
          </Feuille>

          {/* Mission suivante */}
          <Feuille ouverte={panneau === 'suivante'} onFermer={() => setPanneau(null)}>
            {(() => { const nm = MISSIONS[(etat.index + 1) % MISSIONS.length]; return (
              <div>
                <h3 style={{ fontSize: u(40), fontWeight: 800, letterSpacing: '-0.03em' }}>Prêt pour la suite ?</h3>
                <p style={{ fontSize: t(22), color: '#5b4f86', marginTop: u(8) }}>Ta prochaine mission : <b>Jour {etat.index + 2} — {nm.titre}</b>. Tes applis seront de nouveau bloquées jusqu'à ce que tu la valides.</p>
                <div className="flex items-center" style={{ marginTop: u(24), gap: u(20), padding: u(22), borderRadius: u(36), background: '#f7f4ff' }}>
                  <VisuelMission m={nm} taille={58} className="object-contain" style={{ width: u(150), height: u(100), flex: 'none', borderRadius: u(20), background: '#efeaf8' }} />
                  <div><div style={{ fontSize: t(24), fontWeight: 700 }}>{nm.titre} {nm.emoji}</div><div style={{ fontSize: t(19), color: '#7a6fa3' }}>{nm.minutes == null ? 'Tout au long de la journée' : `${nm.minutes} min`}</div></div>
                </div>
                <button onClick={missionSuivante} className="pression btn-violet flex w-full items-center justify-center text-white" style={{ height: u(100), borderRadius: u(50), fontSize: u(29), fontWeight: 700, marginTop: u(28) }}>Commencer maintenant</button>
                <button onClick={() => setPanneau(null)} className="pression w-full" style={{ height: u(80), fontSize: t(22), fontWeight: 600, color: '#5b2fd6', marginTop: u(8) }}>Plus tard (profiter de mes applis)</button>
              </div>); })()}
          </Feuille>

          {/* Détail d'une prochaine mission */}
          <Feuille ouverte={!!missionSel} onFermer={() => setPanneau(null)}>
            {missionSel && (
              <div>
                <div className="flex items-center" style={{ gap: u(14) }}>
                  <span style={{ fontSize: t(22), fontWeight: 700, color: '#7138F5' }}>Jour {missionSel.jourAffiche}</span>
                  <CadenasRond taille={40} clair />
                </div>
                <div className="overflow-hidden" style={{ marginTop: u(18), height: u(260), borderRadius: u(40), background: '#efeaf8' }}>
                  <VisuelMission m={missionSel} taille={140} className={`h-full w-full ${missionSel.jour === 1 ? 'object-cover' : 'object-contain'}`} style={missionSel.jour === 1 ? {} : { padding: u(30) }} />
                </div>
                <h3 style={{ fontSize: u(42), fontWeight: 800, letterSpacing: '-0.03em', marginTop: u(22) }}>{missionSel.titre} {missionSel.emoji}</h3>
                <p style={{ fontSize: t(22), color: '#5b4f86', marginTop: u(8) }}>{missionSel.desc}</p>
                <p className="flex items-center" style={{ gap: u(10), fontSize: t(20), color: '#5b4f86', marginTop: u(14), fontWeight: 600 }}>
                  <Clock style={{ width: u(28), height: u(28) }} /> {missionSel.minutes == null ? 'Tout au long de la journée' : `${missionSel.minutes} min`}
                </p>
                <div className="flex items-center" style={{ marginTop: u(26), gap: u(14), padding: `${u(22)} ${u(26)}`, borderRadius: u(30), background: '#f1edff', color: '#4c3c8f', fontSize: t(19), fontWeight: 500 }}>
                  <Lock style={{ width: u(30), height: u(30), flex: 'none' }} />
                  {missionSel.k === 1 && etat.missionFaite ? 'Ta mission du jour est validée : tu peux la commencer maintenant.' : missionSel.k === 1 ? 'Se débloque quand tu valides ta mission du jour.' : `Se débloque après ${missionSel.k} missions validées.`}
                </div>
                {missionSel.k === 1 && etat.missionFaite && (
                  <button onClick={missionSuivante} className="pression btn-violet flex w-full items-center justify-center text-white" style={{ height: u(100), borderRadius: u(50), fontSize: u(29), fontWeight: 700, marginTop: u(26) }}>Commencer maintenant</button>
                )}
              </div>
            )}
          </Feuille>

          {/* Toutes les missions */}
          <Feuille ouverte={panneau === 'toutes'} onFermer={() => setPanneau(null)}>
            <h3 style={{ fontSize: u(40), fontWeight: 800, letterSpacing: '-0.03em' }}>Programme</h3>
            <p style={{ fontSize: t(21), color: '#5b4f86', marginTop: u(6), marginBottom: u(20) }}>Une mission par jour. Valide-la pour débloquer tes applis.</p>
            {[0, 1, 2, 3].map((k) => {
              const mm = MISSIONS[(etat.index + k) % MISSIONS.length];
              const statut = k === 0 ? (etat.missionFaite ? 'Validée ✓' : 'En cours') : 'Verrouillée';
              return (
                <button key={k} onClick={() => (k === 0 ? setPanneau(null) : setPanneau({ mission: k }))} className="pression flex w-full items-center text-left"
                  style={{ gap: u(20), padding: u(20), marginBottom: u(14), borderRadius: u(34), background: k === 0 ? '#f1edff' : '#faf9fd', border: `${u(2)} solid ${k === 0 ? '#c9b6ff' : '#eee8fa'}` }}>
                  <VisuelMission m={mm} taille={52} className={mm.jour === 1 ? 'object-cover' : 'object-contain'} style={{ width: u(130), height: u(90), flex: 'none', borderRadius: u(20), background: '#efeaf8' }} />
                  <span className="flex-1">
                    <span className="block" style={{ fontSize: t(18), color: '#7138F5', fontWeight: 700 }}>Jour {etat.index + k + 1}</span>
                    <span className="block" style={{ fontSize: t(24), fontWeight: 700 }}>{mm.titre}</span>
                    <span className="block" style={{ fontSize: t(18), color: '#7a6fa3' }}>{mm.minutes == null ? 'Toute la journée' : `${mm.minutes} min`} · {statut}</span>
                  </span>
                  {k > 0 && <CadenasRond taille={40} clair />}
                </button>
              );
            })}
          </Feuille>

          {/* Détail d'une app */}
          <Feuille ouverte={!!appSel} onFermer={() => setPanneau(null)}>
            {appSel && (() => {
              const suivie = etat.appsBloquees.includes(appSel.id);
              const bloquee = suivie && !etat.missionFaite;
              return (
                <div className="text-center">
                  <div className="relative mx-auto" style={{ width: u(150) }}><LogoApp id={appSel.id} taille={150} />
                    <span className="absolute" style={{ right: u(-20), bottom: u(-16) }}><CadenasRond taille={60} ouvert={!bloquee} /></span></div>
                  <h3 style={{ fontSize: u(40), fontWeight: 800, marginTop: u(30) }}>{appSel.nom}</h3>
                  <p style={{ fontSize: t(22), color: '#5b4f86', marginTop: u(8) }}>
                    {!suivie ? 'Cette application n’est pas bloquée (modifiable dans Paramètres).' : bloquee ? 'Bloquée jusqu’à la validation de ta mission du jour.' : 'Débloquée : mission du jour validée. Profite, avec modération ! 😉'}
                  </p>
                  {bloquee && (
                    <button onClick={() => setPanneau('valider') || (setPhoto(null), setCoches([]), setEtape(1), setVerif(null))} className="pression btn-violet flex w-full items-center justify-center text-white" style={{ height: u(100), borderRadius: u(50), fontSize: u(28), fontWeight: 700, marginTop: u(30) }}>
                      Valider ma mission pour débloquer
                    </button>
                  )}
                </div>
              );
            })()}
          </Feuille>

          {/* Explication du blocage */}
          <Feuille ouverte={panneau === 'blocage'} onFermer={() => setPanneau(null)}>
            <h3 style={{ fontSize: u(40), fontWeight: 800, letterSpacing: '-0.03em' }}>Comment ça marche ?</h3>
            {[['🎯', 'Chaque jour, une mission', 'Le chat te donne une mission concrète à réaliser.'], ['🔒', 'Tes applis sont bloquées', 'TikTok, YouTube, Instagram, Snapchat et X restent verrouillées.'], ['✅', 'Tu valides, elles se débloquent', 'Mission validée = applis débloquées jusqu’au lendemain.']].map(([e, ti, tx]) => (
              <div key={ti} className="flex items-start" style={{ gap: u(20), marginTop: u(24) }}>
                <span className="flex items-center justify-center rounded-full" style={{ width: u(70), height: u(70), background: '#f1edff', fontSize: u(34), flex: 'none' }}>{e}</span>
                <span><span className="block" style={{ fontSize: t(24), fontWeight: 700 }}>{ti}</span><span className="block" style={{ fontSize: t(20), color: '#5b4f86' }}>{tx}</span></span>
              </div>
            ))}
            <button onClick={() => { setPanneau(null); setOnglet('parametres'); window.scrollTo({ top: 0 }); }} className="pression w-full" style={{ height: u(90), borderRadius: u(45), background: '#f1edff', color: '#5b2fd6', fontSize: t(22), fontWeight: 700, marginTop: u(34) }}>Choisir les applis à bloquer</button>
          </Feuille>

          {/* Image en grand */}
          <Feuille ouverte={panneau === 'image'} onFermer={() => setPanneau(null)}>
            <div className="overflow-hidden" style={{ borderRadius: u(40), background: '#efeaf8' }}>
              <VisuelMission m={m} alt={m.titre} taille={220} className="w-full object-contain" style={m.image ? { maxHeight: '60vh', padding: m.jour === 1 ? 0 : u(40) } : { height: u(420) }} />
            </div>
            <p style={{ fontSize: t(22), color: '#5b4f86', marginTop: u(18) }}>Objectif : {m.desc}</p>
          </Feuille>

          {/* Notifications */}
          <Feuille ouverte={panneau === 'notifs'} onFermer={() => setPanneau(null)}>
            <h3 style={{ fontSize: u(40), fontWeight: 800, letterSpacing: '-0.03em', marginBottom: u(16) }}>Notifications</h3>
            {perm === 'default' && (
              <button onClick={activerAlertes} className="pression flex w-full items-center text-left" style={{ gap: u(18), padding: `${u(22)} ${u(26)}`, marginBottom: u(10), borderRadius: u(30), background: '#f1edff', color: '#4c3c8f' }}>
                <Bell style={{ width: u(34), height: u(34), flex: 'none' }} />
                <span className="flex-1" style={{ fontSize: t(20), fontWeight: 600 }}>Être prévenu quand le chrono arrive à zéro</span>
                <span className="btn-violet text-white" style={{ padding: `${u(12)} ${u(24)}`, borderRadius: u(30), fontSize: t(19), fontWeight: 700 }}>Activer</span>
              </button>
            )}
            {etat.notifs.map((n) => (
              <div key={n.id} className="flex items-start" style={{ gap: u(18), padding: `${u(20)} 0`, borderBottom: '1px solid #eee8fa' }}>
                <span className="flex items-center justify-center rounded-full" style={{ width: u(60), height: u(60), background: '#f1edff', flex: 'none' }}><Sparkles color="#7138F5" style={{ width: '50%', height: '50%' }} /></span>
                <span><span className="block" style={{ fontSize: t(23), fontWeight: 700 }}>{n.titre}</span><span className="block" style={{ fontSize: t(20), color: '#5b4f86' }}>{n.texte}</span></span>
              </div>
            ))}
          </Feuille>

          {fete && <Confettis />}
          {toast && (
            <div className="pop fixed left-1/2 z-[70] -translate-x-1/2 text-white" style={{ top: u(40), padding: `${u(18)} ${u(30)}`, borderRadius: u(40), background: '#21143F', fontSize: t(21), fontWeight: 600, boxShadow: '0 10px 30px rgba(33,20,63,.4)' }}>{toast}</div>
          )}
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
